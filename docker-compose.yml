services:
  db:
    image: mariadb:11
    environment:
      MARIADB_USER: ragnarok
      MARIADB_PASSWORD: ragnarok
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ragnarok
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - database:/var/lib/mysql

volumes:
  database:
